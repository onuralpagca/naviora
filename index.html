<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naviora Surf — Official Game Page</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #38bdf8;
            --accent-yellow: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .brand img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-blue);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-blue);
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4rem 8%;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 3rem;
        }

        .hero-text {
            flex: 1;
            min-width: 300px;
        }

        .tagline-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: var(--text-muted);
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 480px;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.9rem 1.8rem;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-yellow);
            color: #0f172a;
            box-shadow: 0 4px 14px rgba(250, 204, 21, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background-color: #fde047;
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Screenshot Frame */
        .hero-image {
            flex: 0 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-frame {
            position: relative;
            width: 280px;
            border-radius: 36px;
            padding: 10px;
            background: #1e293b;
            border: 4px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .phone-frame img {
            width: 100%;
            height: auto;
            border-radius: 26px;
            display: block;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: rgba(15, 23, 42, 0.9);
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 0.8rem;
        }

        footer a:hover {
            color: var(--text-main);
            text-decoration: underline;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 3rem 5%;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .cta-buttons {
                justify-content: center;
            }

            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <nav>
        <a href="index.html" class="brand">
            <img src="logo.png" alt="Company Logo">
            <span>Naviora Surf</span>
        </a>
        <div class="nav-links">
            <a href="support.html">Support</a>
            <a href="privacy.html">Privacy</a>
        </div>
    </nav>

    <!-- Main Welcome Content -->
    <main class="hero">
        <div class="hero-text">
            <div class="tagline-badge">The Wave is Coming • Outrun It</div>
            <h1>NAVIORA SURF</h1>
            <p class="description">
                Navigate the surging ocean waves, master endless levels, and collect shells along the way. Available soon on the App Store!
            </p>
            <div class="cta-buttons">
                <a href="support.html" class="btn btn-primary">Contact Support</a>
                <a href="privacy.html" class="btn btn-secondary">Privacy Policy</a>
            </div>
        </div>

        <!-- Phone Styled Screenshot Frame -->
        <div class="hero-image">
            <div class="phone-frame">
                <img src="screenshot.jpg" alt="Naviora Surf Gameplay Screenshot">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div style="margin-bottom: 0.8rem;">
            <a href="support.html">Support</a> • 
            <a href="privacy.html">Privacy Policy</a>
        </div>
        <p>&copy; 2026 Naviora Surf. All rights reserved.</p>
    </footer>

</body>
</html>
